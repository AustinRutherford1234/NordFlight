[package]
name = "gripen-flight"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["3d", "ui", "bevy_gizmos", "default_font", "png", "jpeg", "multi_threaded", "bevy_audio"] }

serde_json = "1"

[patch.crates-io]
block = { path = "vendor/block" }
bevy_pbr = { path = "vendor/bevy_pbr" }

[profile.dev]
opt-level = 1
# Bevy debug symbols otherwise consume tens of gigabytes across rebuilds.
debug = 0
strip = "debuginfo"
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
