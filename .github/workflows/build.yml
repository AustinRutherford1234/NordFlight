name: Build game
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package runtime assets
        shell: bash
        run: |
          mkdir -p dist
          cp -R assets dist/assets
          if [ -f target/release/gripen-flight.exe ]; then
            cp target/release/gripen-flight.exe dist/NordFlight.exe
          else
            cp target/release/gripen-flight dist/gripen-flight
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NordFlight-${{ matrix.os }}
          path: dist/
